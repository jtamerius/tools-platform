AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Amplify Hosting app for the finance tracker (finance.jtamerius.com).
  Provides hosting, custom domain, and SPA routing only.
  Builds are performed by GitHub Actions, which deploys artifacts manually
  via aws amplify create-deployment / start-deployment.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production
    Description: Deployment environment

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsStaging: !Equals [!Ref Environment, staging]

Resources:

  # ---------------------------------------------------------------------------
  # Amplify App — hosting only, no GitHub source connection
  # ---------------------------------------------------------------------------
  FinanceAppAmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub 'tools-finance-app-${Environment}'
      IAMServiceRole: !ImportValue
        'Fn::Sub': 'tools-shared-iam-${Environment}-AmplifyServiceRoleArn'

      # Custom rewrite/redirect rules for SPA routing
      CustomRules:
        # Redirect bare /index.html to / (canonical URL)
        - Source: /index.html
          Target: /
          Status: '301'
        # Serve index.html for any path that doesn't look like a static asset,
        # enabling client-side routing (React Router, etc.)
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
          Target: /index.html
          Status: '200'

      EnableBranchAutoDeletion: true

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: finance-app

  # ---------------------------------------------------------------------------
  # Amplify Branch — receives manual artifact deployments from GitHub Actions
  # ---------------------------------------------------------------------------
  FinanceAppAmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt FinanceAppAmplifyApp.AppId
      BranchName: !If [IsProduction, main, staging]
      Description: !Sub 'Deployment target for the ${Environment} environment'
      EnableAutoBuild: false
      EnablePullRequestPreview: false
      Framework: Vite
      Stage: !If [IsProduction, PRODUCTION, DEVELOPMENT]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: finance-app

  # ---------------------------------------------------------------------------
  # Amplify Custom Domain — finance.jtamerius.com
  # Covered by the existing *.jtamerius.com ACM certificate.
  # Only created in production; staging uses the default amplifyapp.com domain.
  # ---------------------------------------------------------------------------
  FinanceAppAmplifyDomain:
    Type: AWS::Amplify::Domain
    Condition: IsProduction
    Properties:
      AppId: !GetAtt FinanceAppAmplifyApp.AppId
      DomainName: jtamerius.com
      SubDomainSettings:
        - Prefix: finance
          BranchName: !GetAtt FinanceAppAmplifyBranch.BranchName

Outputs:
  AmplifyAppId:
    Description: Amplify Application ID for the finance app
    Value: !GetAtt FinanceAppAmplifyApp.AppId
    Export:
      Name: !Sub 'tools-shared-amplify-finance-${Environment}-AppId'

  AmplifyAppArn:
    Description: Amplify Application ARN for the finance app
    Value: !GetAtt FinanceAppAmplifyApp.Arn
    Export:
      Name: !Sub 'tools-shared-amplify-finance-${Environment}-AppArn'

  DefaultDomain:
    Description: >
      Amplify-generated default domain (e.g. d1234abcd.amplifyapp.com).
      Use this for smoke-testing before DNS cutover.
    Value: !GetAtt FinanceAppAmplifyApp.DefaultDomain
    Export:
      Name: !Sub 'tools-shared-amplify-finance-${Environment}-DefaultDomain'

  BranchName:
    Description: Branch receiving deployments for this environment
    Value: !GetAtt FinanceAppAmplifyBranch.BranchName
    Export:
      Name: !Sub 'tools-shared-amplify-finance-${Environment}-BranchName'

  SiteURL:
    Description: Production URL for the finance app
    Condition: IsProduction
    Value: https://finance.jtamerius.com
