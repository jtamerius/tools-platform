AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM roles for the tools platform CI/CD pipeline and AWS Amplify service.
  GitHubActionsRole uses OIDC federation — no long-lived credentials required.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production
    Description: Deployment environment

  CreateOIDCProvider:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: >
      Set to "false" if the GitHub Actions OIDC provider already exists in this
      account (e.g. when deploying a second environment). The provider is
      account-level and can only exist once per account.

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:

  # ---------------------------------------------------------------------------
  # GitHub Actions OIDC provider (account-level singleton).
  # Only created when CreateOIDCProvider=true. Set to false for the second
  # environment deployment — the provider already exists from the first.
  # ---------------------------------------------------------------------------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # Stable GitHub Actions OIDC thumbprints (rotate if GitHub rotates cert)
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ---------------------------------------------------------------------------
  # GitHub Actions Role — assumed by GitHub Actions workflows via OIDC
  # ---------------------------------------------------------------------------
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'tools-github-actions-${Environment}'
      Description: >
        Assumed by GitHub Actions via OIDC to deploy tools-platform stacks
        and trigger Amplify builds for the jtamerius/website_hub monorepo.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                # Allow any ref (branch, tag, PR) within the website_hub monorepo
                'token.actions.githubusercontent.com:sub': 'repo:jtamerius/website_hub:*'
      MaxSessionDuration: 3600
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
      Policies:
        - PolicyName: CloudFormationDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationFullAccess
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStacks
                  - cloudformation:GetTemplateSummary
                Resource: '*'

        - PolicyName: S3DeployArtifactsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                Resource:
                  - !Sub 'arn:aws:s3:::tools-cfn-artifacts-${Environment}-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::tools-cfn-artifacts-${Environment}-${AWS::AccountId}/*'

        - PolicyName: AmplifyDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AmplifyDeploy
                Effect: Allow
                Action:
                  - amplify:StartJob
                  - amplify:StopJob
                  - amplify:GetJob
                  - amplify:ListJobs
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                  - amplify:GetApp
                  - amplify:ListApps
                  - amplify:GetBranch
                  - amplify:ListBranches
                Resource: '*'

        - PolicyName: SSMReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SSMGetParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/${Environment}/*'
                  # finance-tracker auth secret (legacy SSM key, not env-namespaced)
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finance-tracker'

        - PolicyName: CognitoReadOnlyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CognitoReadOnly
                Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:ListUserPools
                  - cognito-idp:ListUserPoolClients
                  - cognito-idp:GetGroup
                  - cognito-idp:ListGroups
                Resource: '*'

        - PolicyName: IAMPassRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PassRoleToAmplify
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/tools-amplify-service-${Environment}'
                Condition:
                  StringEquals:
                    'iam:PassedToService': amplify.amazonaws.com
              - Sid: PassRoleToLambda
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/jtamerius-*'
                Condition:
                  StringEquals:
                    'iam:PassedToService': lambda.amazonaws.com

        - PolicyName: LambdaDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaCRUD
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:InvokeFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetFunctionConcurrency
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:jtamerius-*'

        - PolicyName: LambdaS3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaCodeBucket
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:CreateBucket
                Resource:
                  - arn:aws:s3:::jtamerius-website-deploy
                  - arn:aws:s3:::jtamerius-website-deploy/*
              - Sid: WebsiteBucketFinanceHTML
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - arn:aws:s3:::jtamerius/finance/*
              - Sid: NewsDataBucket
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - arn:aws:s3:::jtamerius-news-data/*

        - PolicyName: EventBridgeDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EventBridgeCRUD
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/jtamerius-*'

        - PolicyName: CloudWatchLogsDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LogGroupCRUD
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagLogGroup
                  - logs:ListTagsLogGroup
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/jtamerius-*'

        - PolicyName: IAMLambdaRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageLambdaExecutionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/jtamerius-*'

  # ---------------------------------------------------------------------------
  # News Scraper IAM User — used by the scheduled Claude Code remote agent
  # to fetch LLM API keys from SSM and upload results to S3.
  # The access key is stored as a SecureString in SSM after stack creation.
  # ---------------------------------------------------------------------------
  NewsScraperUser:
    Type: AWS::IAM::User
    Properties:
      UserName: jtamerius-news-scraper
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
      Policies:
        - PolicyName: NewsScraperPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Upload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: arn:aws:s3:::jtamerius-news-data/*
              - Sid: SSMReadLLMKeys
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/groq-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/gemini-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/hf-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/openrouter-api-key'

  NewsScraperAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref NewsScraperUser

  NewsScraperAccessKeyIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /tools/news-scraper/aws-access-key-id
      Type: String
      Value: !Ref NewsScraperAccessKey
      Description: Access key ID for jtamerius-news-scraper IAM user

  NewsScraperSecretAccessKeyParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /tools/news-scraper/aws-secret-access-key
      Type: String
      Value: !GetAtt NewsScraperAccessKey.SecretAccessKey
      Description: Secret access key for jtamerius-news-scraper IAM user

        # -----------------------------------------------------------------------
        # The policies below are required to deploy app-specific stacks that
        # create backend resources (IAM service roles, S3, Step Functions, etc.).
        #
        # BOOTSTRAP NOTE: This IAM stack itself must be (re-)deployed with
        # elevated credentials the first time these policies are added, because
        # the existing GitHubActionsRole does not yet have iam:PutRolePolicy.
        # After this update is applied, subsequent stack deployments — including
        # those that create IAM roles — can be performed via GitHub Actions.
        # -----------------------------------------------------------------------

        # Allow CloudFormation to create and manage IAM roles for backend app
        # stacks (e.g. tools-maritime-sagemaker-*, tools-maritime-sfn-*).
        # Scoped to the tools-maritime-* naming convention to prevent privilege
        # escalation beyond the platform's own roles.
        - PolicyName: IAMServiceRoleManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageScopedServiceRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/tools-maritime-*'
              - Sid: PassRoleToBackendServices
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/tools-maritime-*'
                Condition:
                  StringEquals:
                    'iam:PassedToService':
                      - sagemaker.amazonaws.com
                      - states.amazonaws.com
                      - events.amazonaws.com

        # S3 bucket management for maritime data buckets (tools-maritime-*).
        # The existing S3DeployArtifactsPolicy only covers the CFN artifacts bucket.
        - PolicyName: S3MaritimeBucketPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageMaritimeBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetBucketEncryption
                  - s3:PutBucketEncryption
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource:
                  - !Sub 'arn:aws:s3:::tools-maritime-*'

        # Step Functions state machine management for maritime pipelines.
        - PolicyName: StepFunctionsMaritimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageMaritimeStateMachines
                Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DeleteStateMachine
                  - states:UpdateStateMachine
                  - states:DescribeStateMachine
                  - states:TagResource
                  - states:UntagResource
                  - states:ListTagsForResource
                Resource:
                  - !Sub 'arn:aws:states:*:${AWS::AccountId}:stateMachine:tools-maritime-*'

        # EventBridge rule management for maritime scheduled triggers.
        - PolicyName: EventBridgeMaritimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageMaritimeEventRules
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:TagResource
                  - events:UntagResource
                Resource:
                  - !Sub 'arn:aws:events:*:${AWS::AccountId}:rule/tools-maritime-*'

        # CloudWatch Logs group management for Step Functions execution logs.
        - PolicyName: CloudWatchLogsMaritimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageMaritimeLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagLogGroup
                  - logs:TagResource
                Resource:
                  - !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/tools/maritime/*'

        # SSM Parameter writes for app stacks that publish resource identifiers.
        # The existing SSMReadPolicy only covers Get operations.
        - PolicyName: SSMWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteToolsParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/${Environment}/*'

  # ---------------------------------------------------------------------------
  # Amplify Service Role — assumed by AWS Amplify to access other AWS services
  # ---------------------------------------------------------------------------
  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'tools-amplify-service-${Environment}'
      Description: Service role assumed by AWS Amplify Hosting for the tools platform.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-Amplify
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform

Outputs:
  GitHubActionsRoleArn:
    Description: ARN of the GitHub Actions OIDC IAM role
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub 'tools-shared-iam-${Environment}-GitHubActionsRoleArn'

  AmplifyServiceRoleArn:
    Description: ARN of the Amplify service IAM role
    Value: !GetAtt AmplifyServiceRole.Arn
    Export:
      Name: !Sub 'tools-shared-iam-${Environment}-AmplifyServiceRoleArn'
