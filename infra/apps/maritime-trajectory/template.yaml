AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Full-stack infrastructure for the Maritime Trajectory Prediction app.
  Phase 1: two S3 buckets, SageMaker + Step Functions for AIS data synthesis.
  Phase 2: Lambda dataset API, HTTP API Gateway, and Amplify Hosting for the
  React frontend that lets users browse Maritime Master Record partitions.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production
    Description: Deployment environment

  UserPoolId:
    Type: String
    Description: >
      Shared Cognito User Pool ID. Passed from the shared cognito stack output,
      e.g. via --parameter-overrides in deploy-app.sh. Required when the Phase 2
      Amplify frontend is deployed so the build environment can resolve the pool ID.
    AllowedPattern: '[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]+'
    ConstraintDescription: Must be a valid Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI).

  UserPoolClientId:
    Type: String
    Description: >
      Shared Cognito User Pool Client ID. Passed from the shared cognito stack output.
    AllowedPattern: '[a-z0-9]+'
    ConstraintDescription: Must be a valid Cognito User Pool Client ID (lowercase alphanumeric).

  GitHubOAuthToken:
    Type: String
    NoEcho: true
    Description: >
      GitHub Personal Access Token (classic) with repo scope. Used by Amplify
      to pull source code. Pass from AWS Secrets Manager at deploy time — never
      commit the raw value. Same token used by the shared amplify stack.

  AWSSDKPandasLayerVersion:
    Type: Number
    Default: 21
    Description: >
      Version number of the AWS-managed AWSSDKPandas-Python311 Lambda layer
      (account 336392948345). Check the latest version at:
      https://aws-sdk-pandas.readthedocs.io/en/stable/install.html#aws-lambda-managed-layers

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsStaging:    !Equals [!Ref Environment, staging]

Resources:

  # ---------------------------------------------------------------------------
  # S3 — Raw AIS input bucket
  #
  # Receives Zstd-compressed CSVs sourced from MarineCadastre.gov and AVIS
  # vessel metadata files. Also used to store the processing script so
  # SageMaker can mount it at runtime (upload to the scripts/ prefix).
  # ---------------------------------------------------------------------------
  AisInputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'tools-maritime-ais-input-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveRawAfter90Days
            Status: Enabled
            Prefix: raw/
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # S3 — Processed output bucket
  #
  # Receives the enriched Maritime Master Record written as partitioned Parquet
  # (partitioned by VesselGroup). The Deck.gl frontend reads trajectories from
  # this bucket; the Bi-LSTM training job reads it as its training dataset.
  # ---------------------------------------------------------------------------
  ProcessedOutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'tools-maritime-processed-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldRecordsAfter365Days
            Status: Enabled
            Prefix: master-record/
            ExpirationInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # IAM — SageMaker Processing Job execution role
  #
  # Grants SageMaker read access to the AIS input bucket and write access to
  # the processed output bucket. AmazonSageMakerFullAccess is included for
  # CloudWatch Logs and ECR image pull; the S3 policy below further scopes
  # data access to this app's buckets only.
  # ---------------------------------------------------------------------------
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'tools-maritime-sagemaker-${Environment}'
      Description: >
        Assumed by SageMaker Processing Jobs in the maritime AIS pipeline.
        Scoped to read the AIS input bucket and write the processed output bucket.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: MaritimeS3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAisInput
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AisInputBucket.Arn
                  - !Sub '${AisInputBucket.Arn}/*'
              - Sid: WriteProcessedOutput
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ProcessedOutputBucket.Arn
                  - !Sub '${ProcessedOutputBucket.Arn}/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # IAM — Step Functions execution role
  #
  # Allows the state machine to create and monitor SageMaker Processing Jobs
  # and to write execution logs to CloudWatch. The PassRole permission is
  # scoped specifically to the SageMaker role above.
  # ---------------------------------------------------------------------------
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'tools-maritime-sfn-${Environment}'
      Description: >
        Assumed by the maritime AIS pipeline Step Functions state machine.
        Grants SageMaker Processing Job creation and CloudWatch Logs delivery.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub 'states.${AWS::Region}.amazonaws.com'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SageMakerProcessingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateAndMonitorProcessingJobs
                Effect: Allow
                Action:
                  - sagemaker:CreateProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:ListProcessingJobs
                  - sagemaker:AddTags
                Resource: '*'
              - Sid: PassRoleToSageMaker
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SageMakerExecutionRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': sagemaker.amazonaws.com
        - PolicyName: CloudWatchLogsDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteExecutionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
        - PolicyName: XRayTracingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: XRayAccess
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # IAM — EventBridge role to trigger the pipeline on a daily schedule
  # ---------------------------------------------------------------------------
  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'tools-maritime-events-${Environment}'
      Description: >
        Assumed by EventBridge to start the maritime AIS pipeline state machine
        on the daily cron schedule.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartPipelineExecution
                Effect: Allow
                Action: states:StartExecution
                Resource: !Ref AisPipelineStateMachine
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # CloudWatch Logs — Step Functions execution log group
  # ---------------------------------------------------------------------------
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/tools/maritime/sfn-pipeline-${Environment}'
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # Step Functions — AIS Processing Pipeline state machine (Phase 1)
  #
  # Execution input schema (all fields required):
  #
  #   AisInputPrefix      s3://bucket/prefix/ pointing at Zstd-compressed AIS CSVs
  #   AvisInputUri        s3://bucket/prefix/ pointing at AVIS vessel metadata
  #   OutputPrefix        s3://bucket/prefix/ for the processed Parquet output
  #   ProcessingScriptUri s3://bucket/prefix/ containing ais_merge.py
  #                       (upload src/processing/ais_merge.py to the scripts/
  #                        prefix of the AIS input bucket before first run)
  #   ProcessingImageUri  ECR or public image with pandas, pyarrow, zstandard.
  #                       AWS managed: 683313688378.dkr.ecr.us-east-1.amazonaws.com/
  #                         sagemaker-scikit-learn:1.2-1-cpu-py3
  #                       Note: install pyarrow and zstandard via pip in a custom
  #                       image or add a requirements.txt to the scripts/ prefix.
  #   InstanceType        SageMaker instance type, e.g. "ml.m5.xlarge"
  #
  # The .sync:2 resource suffix causes Step Functions to poll SageMaker until
  # the Processing Job reaches a terminal state before advancing. On failure,
  # up to 2 retries are attempted with exponential back-off before the
  # execution transitions to ProcessingFailed.
  # ---------------------------------------------------------------------------
  AisPipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'tools-maritime-ais-pipeline-${Environment}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt PipelineLogGroup.Arn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Maritime AIS data synthesis pipeline — Phase 1. Merges dynamic AIS pings with AVIS vessel metadata, cleans coordinates, and segments trajectories into trip records partitioned by VesselGroup.",
              "StartAt": "StartAISProcessingJob",
              "States": {
                "StartAISProcessingJob": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::sagemaker:createProcessingJob.sync:2",
                  "Parameters": {
                    "ProcessingJobName.$": "States.Format('ais-merge-{}', $$.Execution.Name)",
                    "RoleArn": "${SageMakerRoleArn}",
                    "AppSpecification": {
                      "ImageUri.$": "$.ProcessingImageUri",
                      "ContainerEntrypoint": ["python3", "/opt/ml/processing/code/ais_merge.py"]
                    },
                    "ProcessingInputs": [
                      {
                        "InputName": "ais-raw",
                        "S3Input": {
                          "S3Uri.$": "$.AisInputPrefix",
                          "LocalPath": "/opt/ml/processing/input/ais",
                          "S3DataType": "S3Prefix",
                          "S3InputMode": "File",
                          "S3CompressionType": "None"
                        }
                      },
                      {
                        "InputName": "avis",
                        "S3Input": {
                          "S3Uri.$": "$.AvisInputUri",
                          "LocalPath": "/opt/ml/processing/input/avis",
                          "S3DataType": "S3Prefix",
                          "S3InputMode": "File",
                          "S3CompressionType": "None"
                        }
                      },
                      {
                        "InputName": "code",
                        "S3Input": {
                          "S3Uri.$": "$.ProcessingScriptUri",
                          "LocalPath": "/opt/ml/processing/code",
                          "S3DataType": "S3Prefix",
                          "S3InputMode": "File",
                          "S3CompressionType": "None"
                        }
                      }
                    ],
                    "ProcessingOutputConfig": {
                      "Outputs": [
                        {
                          "OutputName": "master-record",
                          "S3Output": {
                            "S3Uri.$": "$.OutputPrefix",
                            "LocalPath": "/opt/ml/processing/output",
                            "S3UploadMode": "EndOfJob"
                          }
                        }
                      ]
                    },
                    "ProcessingResources": {
                      "ClusterConfig": {
                        "InstanceCount": 1,
                        "InstanceType.$": "$.InstanceType",
                        "VolumeSizeInGB": 100
                      }
                    },
                    "StoppingCondition": {
                      "MaxRuntimeInSeconds": 86400
                    }
                  },
                  "Retry": [
                    {
                      "ErrorEquals": [
                        "SageMaker.SageMakerException",
                        "SageMaker.ResourceLimitExceededException"
                      ],
                      "IntervalSeconds": 60,
                      "MaxAttempts": 2,
                      "BackoffRate": 2.0
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "ProcessingFailed"
                    }
                  ],
                  "ResultPath": "$.processingResult",
                  "Next": "ProcessingSucceeded"
                },
                "ProcessingSucceeded": {
                  "Type": "Succeed",
                  "Comment": "Maritime Master Record written to S3 OutputPrefix."
                },
                "ProcessingFailed": {
                  "Type": "Fail",
                  "Error": "AISProcessingJobFailed",
                  "Cause": "SageMaker Processing Job did not complete successfully. Check CloudWatch Logs for the job."
                }
              }
            }
          - SageMakerRoleArn: !GetAtt SageMakerExecutionRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # EventBridge — Daily pipeline trigger (DISABLED by default)
  #
  # Enable after:
  #   1. At least one day of AIS data is uploaded to the input bucket.
  #   2. The processing container image is built and pushed to ECR.
  #   3. ais_merge.py is uploaded to the scripts/ prefix of the input bucket.
  #
  # Update the Input JSON below to match your S3 layout and container URI
  # before enabling. The cron fires at 02:00 UTC to process the previous day.
  # ---------------------------------------------------------------------------
  DailyPipelineSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'tools-maritime-daily-pipeline-${Environment}'
      Description: >
        Triggers the maritime AIS pipeline Step Functions state machine at
        02:00 UTC daily. Disabled until data and container are ready.
      ScheduleExpression: 'cron(0 2 * * ? *)'
      State: DISABLED
      Targets:
        - Id: AisPipelineTarget
          Arn: !Ref AisPipelineStateMachine
          RoleArn: !GetAtt EventBridgeSchedulerRole.Arn
          Input: !Sub
            - |
              {
                "AisInputPrefix": "s3://${InputBucket}/raw/",
                "AvisInputUri": "s3://${InputBucket}/avis/",
                "OutputPrefix": "s3://${OutputBucket}/master-record/",
                "ProcessingScriptUri": "s3://${InputBucket}/scripts/",
                "ProcessingImageUri": "REPLACE_WITH_ECR_IMAGE_URI",
                "InstanceType": "ml.m5.xlarge"
              }
            - InputBucket: !Ref AisInputBucket
              OutputBucket: !Ref ProcessedOutputBucket

  # ---------------------------------------------------------------------------
  # SSM — Cognito IDs for the Phase 2 Amplify frontend
  #
  # Mirrors the pattern from infra/apps/landing-page/template.yaml so the
  # maritime Amplify app can resolve Cognito credentials at build time via
  # {{resolve:ssm:...}} dynamic references, exactly as the landing page does.
  # ---------------------------------------------------------------------------
  MaritimeSSMUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/cognito/user-pool-id'
      Type: String
      Value: !Ref UserPoolId
      Description: !Sub 'Cognito User Pool ID for the maritime trajectory app (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  MaritimeSSMClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/cognito/client-id'
      Type: String
      Value: !Ref UserPoolClientId
      Description: !Sub 'Cognito User Pool Client ID for the maritime trajectory app (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  # ---------------------------------------------------------------------------
  # SSM — Expose key resource identifiers for other stacks and the frontend
  # ---------------------------------------------------------------------------
  SSMInputBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/ais-input-bucket'
      Type: String
      Value: !Ref AisInputBucket
      Description: !Sub 'S3 bucket name for raw maritime AIS input data (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  SSMOutputBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/processed-output-bucket'
      Type: String
      Value: !Ref ProcessedOutputBucket
      Description: !Sub 'S3 bucket name for processed Maritime Master Records (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  SSMStateMachineArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/state-machine-arn'
      Type: String
      Value: !Ref AisPipelineStateMachine
      Description: !Sub 'ARN of the maritime AIS pipeline Step Functions state machine (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  # ---------------------------------------------------------------------------
  # IAM — Lambda execution role
  # ---------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'tools-maritime-lambda-${Environment}'
      Description: >
        Assumed by the dataset API Lambda. Grants read access to the processed
        output bucket and CloudWatch Logs write access.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadProcessedOutputPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadProcessedOutput
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ProcessedOutputBucket.Arn
                  - !Sub '${ProcessedOutputBucket.Arn}/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # Lambda — Dataset API function
  #
  # Two routes (handled by routeKey):
  #   GET /datasets         → list available vessel-group partition names
  #   GET /datasets/{group} → read up to ?limit rows from the partition as JSON
  #
  # Requires the AWSSDKPandas-Python311 managed layer for awswrangler + pyarrow.
  # ---------------------------------------------------------------------------
  DatasetApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'tools-maritime-dataset-api-${Environment}'
      Description: Reads Maritime Master Record Parquet partitions and returns JSON.
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Sub 'arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python311:${AWSSDKPandasLayerVersion}'
      Environment:
        Variables:
          BUCKET: !Ref ProcessedOutputBucket
      Code:
        ZipFile: |
          import json, os, boto3

          BUCKET = os.environ['BUCKET']

          def handler(event, context):
              route = event.get('routeKey', '')
              params = event.get('pathParameters') or {}
              qs = event.get('queryStringParameters') or {}
              if route == 'GET /datasets':
                  return list_groups()
              if route == 'GET /datasets/{group}':
                  return get_group(params.get('group', ''), int(qs.get('limit', 100)))
              return resp(404, {'error': 'Route not found'})

          def list_groups():
              r = boto3.client('s3').list_objects_v2(
                  Bucket=BUCKET, Prefix='master-record/', Delimiter='/')
              groups = sorted(
                  cp['Prefix'].rstrip('/').split('vessel_group=')[-1]
                  for cp in r.get('CommonPrefixes', []))
              return resp(200, {'groups': groups})

          def get_group(group, limit):
              import awswrangler as wr
              try:
                  df = wr.s3.read_parquet(
                      f"s3://{BUCKET}/master-record/vessel_group={group}/").head(limit)
                  for c in df.select_dtypes(
                          include=['datetime64[ns]', 'datetimetz']).columns:
                      df[c] = df[c].astype(str)
                  return resp(200, {'group': group,
                                    'columns': list(df.columns),
                                    'rows': df.to_dict('records'),
                                    'count': len(df)})
              except Exception as exc:
                  return resp(404, {'error': str(exc)})

          def resp(code, body):
              return {'statusCode': code,
                      'headers': {'Content-Type': 'application/json',
                                  'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps(body, default=str)}
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform
        - Key: App
          Value: maritime-trajectory

  # ---------------------------------------------------------------------------
  # API Gateway — HTTP API (v2) with CORS
  # ---------------------------------------------------------------------------
  DatasetHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'tools-maritime-api-${Environment}'
      Description: Maritime dataset API — lists and reads Master Record partitions.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !If
            - IsProduction
            - 'https://maritime.jtamerius.com'
            - 'https://maritime.staging.jtamerius.com'
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  DatasetApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DatasetHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DatasetApiFunction.Arn
      PayloadFormatVersion: '2.0'

  DatasetListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DatasetHttpApi
      RouteKey: 'GET /datasets'
      Target: !Sub 'integrations/${DatasetApiIntegration}'

  DatasetGroupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DatasetHttpApi
      RouteKey: 'GET /datasets/{group}'
      Target: !Sub 'integrations/${DatasetApiIntegration}'

  DatasetApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DatasetHttpApi
      StageName: '$default'
      AutoDeploy: true

  DatasetApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DatasetApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DatasetHttpApi}/*/*'

  # ---------------------------------------------------------------------------
  # SSM — API Gateway endpoint URL
  # (read by the Amplify build to inject VITE_MARITIME_API_URL)
  # ---------------------------------------------------------------------------
  SSMApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/api-url'
      Type: String
      Value: !Sub 'https://${DatasetHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
      Description: !Sub 'Maritime dataset API Gateway URL (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

  # ---------------------------------------------------------------------------
  # Amplify — Maritime Trajectory frontend app
  #
  # Follows the same pattern as infra/shared/amplify/template.yaml for the
  # landing page. The build injects three VITE_ env vars from SSM so no
  # values are hard-coded in the template or the GitHub repository.
  # ---------------------------------------------------------------------------
  MaritimeAmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub 'tools-maritime-trajectory-${Environment}'
      Repository: https://github.com/jtamerius/website_hub
      OauthToken: !Ref GitHubOAuthToken
      IAMServiceRole: !ImportValue
        'Fn::Sub': 'tools-shared-iam-${Environment}-AmplifyServiceRoleArn'
      BuildSpec: |
        version: 1
        applications:
          - appRoot: apps/maritime-trajectory
            frontend:
              phases:
                preBuild:
                  commands:
                    - npm install
                build:
                  commands:
                    - npm run build
              artifacts:
                baseDirectory: dist
                files:
                  - '**/*'
              cache:
                paths:
                  - node_modules/**/*
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: apps/maritime-trajectory
        - Name: VITE_ENV
          Value: !Ref Environment
        - Name: VITE_COGNITO_USER_POOL_ID
          Value: !Sub '{{resolve:ssm:/tools/${Environment}/maritime/cognito/user-pool-id}}'
        - Name: VITE_COGNITO_CLIENT_ID
          Value: !Sub '{{resolve:ssm:/tools/${Environment}/maritime/cognito/client-id}}'
        - Name: VITE_MARITIME_API_URL
          Value: !Sub 'https://${DatasetHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
      CustomRules:
        - Source: /index.html
          Target: /
          Status: '301'
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
          Target: /index.html
          Status: '200'
      EnableBranchAutoDeletion: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform

  MaritimeAmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt MaritimeAmplifyApp.AppId
      BranchName: !If [IsProduction, main, staging]
      Description: !Sub 'Auto-tracked branch for the ${Environment} environment'
      EnableAutoBuild: true
      EnablePullRequestPreview: !If [IsStaging, true, false]
      Framework: Vite
      Stage: !If [IsProduction, PRODUCTION, DEVELOPMENT]
      EnvironmentVariables:
        - Name: VITE_ENV
          Value: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform

  # SSM — Amplify App ID so the deploy workflow can trigger builds without
  # hard-coding it as a GitHub secret (mirrors how deploy-app.sh resolves IDs).
  SSMAmplifyAppId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/tools/${Environment}/maritime/amplify-app-id'
      Type: String
      Value: !GetAtt MaritimeAmplifyApp.AppId
      Description: !Sub 'Amplify App ID for the maritime trajectory frontend (${Environment})'
      Tags:
        Environment: !Ref Environment
        Project: tools-platform
        App: maritime-trajectory

Outputs:

  AisInputBucketName:
    Description: S3 bucket for raw AIS Zstd CSVs and AVIS metadata
    Value: !Ref AisInputBucket
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-AisInputBucketName'

  ProcessedOutputBucketName:
    Description: S3 bucket for enriched Maritime Master Record Parquet partitions
    Value: !Ref ProcessedOutputBucket
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-ProcessedOutputBucketName'

  ProcessedOutputBucketArn:
    Description: ARN of the processed output bucket (for cross-stack IAM grants)
    Value: !GetAtt ProcessedOutputBucket.Arn
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-ProcessedOutputBucketArn'

  SageMakerExecutionRoleArn:
    Description: ARN of the SageMaker Processing Job execution role
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-SageMakerExecutionRoleArn'

  StateMachineArn:
    Description: ARN of the AIS pipeline Step Functions state machine
    Value: !Ref AisPipelineStateMachine
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-StateMachineArn'

  SSMUserPoolIdPath:
    Description: SSM path for the Cognito User Pool ID (for Amplify build resolution)
    Value: !Ref MaritimeSSMUserPoolId
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-SSMUserPoolIdPath'

  SSMClientIdPath:
    Description: SSM path for the Cognito Client ID (for Amplify build resolution)
    Value: !Ref MaritimeSSMClientId
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-SSMClientIdPath'

  DatasetApiUrl:
    Description: HTTP API Gateway endpoint for the maritime dataset API
    Value: !Sub 'https://${DatasetHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-DatasetApiUrl'

  AmplifyAppId:
    Description: Amplify App ID for the maritime trajectory frontend
    Value: !GetAtt MaritimeAmplifyApp.AppId
    Export:
      Name: !Sub 'tools-app-maritime-trajectory-${Environment}-AmplifyAppId'
