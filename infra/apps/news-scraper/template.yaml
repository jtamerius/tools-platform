AWSTemplateFormatVersion: '2010-09-09'
Description: >
  News scraper Lambda + EventBridge schedule.
  Runs daily at 23:00 UTC, uploads latest.json to S3.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]

  LambdaCodeBucket:
    Type: String
    Default: jtamerius-website-deploy
    Description: S3 bucket containing the Lambda zip

  LambdaMemory:
    Type: Number
    Default: 512

  LambdaTimeout:
    Type: Number
    Default: 600
    Description: Max seconds (10 min — scraper takes ~3 min)

Resources:

  # ---------------------------------------------------------------------------
  # Execution role — Lambda assumes this; scoped to SSM + S3 + logs
  # ---------------------------------------------------------------------------
  NewsScraperLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'jtamerius-news-scraper-lambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NewsScraperLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SSMReadLLMKeys
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/groq-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/gemini-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/hf-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tools/news-scraper/openrouter-api-key'
              - Sid: S3Upload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: arn:aws:s3:::jtamerius-news-data/*

  # ---------------------------------------------------------------------------
  # Lambda function
  # ---------------------------------------------------------------------------
  NewsScraperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'jtamerius-news-scraper-${Environment}'
      Description: Scrapes top news headlines from 96 countries and uploads to S3
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt NewsScraperLambdaRole.Arn
      MemorySize: !Ref LambdaMemory
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: news-scraper/lambda_package.zip
      Environment:
        Variables:
          S3_BUCKET: jtamerius-news-data
          S3_KEY: latest.json
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: tools-platform

  NewsScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/jtamerius-news-scraper-${Environment}'
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # EventBridge rule — fires daily at 23:00 UTC
  # ---------------------------------------------------------------------------
  NewsScraperSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'jtamerius-news-scraper-daily-${Environment}'
      Description: Trigger news scraper Lambda daily at 23:00 UTC
      ScheduleExpression: 'cron(0 23 * * ? *)'
      State: ENABLED
      Targets:
        - Id: NewsScraperLambda
          Arn: !GetAtt NewsScraperFunction.Arn

  NewsScraperSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt NewsScraperFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NewsScraperSchedule.Arn

Outputs:
  FunctionName:
    Value: !Ref NewsScraperFunction
    Export:
      Name: !Sub 'tools-app-news-scraper-${Environment}-FunctionName'

  FunctionArn:
    Value: !GetAtt NewsScraperFunction.Arn
    Export:
      Name: !Sub 'tools-app-news-scraper-${Environment}-FunctionArn'
