name: CI

on:
  pull_request:
    branches:
      - main
      - staging

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read
  pull-requests: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Detect which parts of the monorepo changed
  # -----------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      landing-page: ${{ steps.filter.outputs.landing-page }}
      weather-app: ${{ steps.filter.outputs.weather-app }}
      finance-app: ${{ steps.filter.outputs.finance-app }}
      infra-shared: ${{ steps.filter.outputs.infra-shared }}
      infra-landing-page: ${{ steps.filter.outputs.infra-landing-page }}
      weather-collector: ${{ steps.filter.outputs.weather-collector }}
      finance-tracker: ${{ steps.filter.outputs.finance-tracker }}
      purgatory-rollup: ${{ steps.filter.outputs.purgatory-rollup }}
      python-tests: ${{ steps.filter.outputs.python-tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing-page:
              - 'apps/landing-page/**'
              - 'shared/**'
            weather-app:
              - 'apps/weather/frontend/**'
              - 'shared/**'
            finance-app:
              - 'apps/finance/frontend/**'
              - 'shared/**'
            infra-shared:
              - 'infra/shared/**'
            infra-landing-page:
              - 'infra/apps/landing-page/**'
            weather-collector:
              - 'apps/weather/pipeline/**'
            finance-tracker:
              - 'apps/finance/api/**'
            python-tests:
              - 'apps/investment-tracker/parser/**'
            purgatory-rollup:
              - 'apps/purgatory/rollup/**'
              - 'apps/purgatory/api/**'
              - 'infra/cdk/lib/stacks/purgatory-stack.ts'

  # -----------------------------------------------------------------------
  # Job 2: Lint, test, and build the landing-page app
  # -----------------------------------------------------------------------
  lint-and-test-landing-page:
    name: Lint & Test — landing-page
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.landing-page == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/landing-page
        run: npm ci

      - name: Lint
        working-directory: apps/landing-page
        run: npm run lint

      - name: Test
        working-directory: apps/landing-page
        run: npm run test

      - name: Build (verify)
        working-directory: apps/landing-page
        run: npm run build

  # -----------------------------------------------------------------------
  # Job 2b: Lint, test, and build the weather-app
  # -----------------------------------------------------------------------
  lint-and-test-weather-app:
    name: Lint & Test — weather-app
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.weather-app == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/weather/frontend
        run: npm ci

      - name: Lint
        working-directory: apps/weather/frontend
        run: npm run lint

      - name: Test
        working-directory: apps/weather/frontend
        run: npm run test

      - name: Build (verify)
        working-directory: apps/weather/frontend
        run: npm run build

  # -----------------------------------------------------------------------
  # Job 2c: Lint, test, and build the finance-app
  # -----------------------------------------------------------------------
  lint-and-test-finance-app:
    name: Lint & Test — finance-app
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.finance-app == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/finance/frontend
        run: npm ci

      - name: Lint
        working-directory: apps/finance/frontend
        run: npm run lint

      - name: Test
        working-directory: apps/finance/frontend
        run: npm run test

      - name: Build (verify)
        working-directory: apps/finance/frontend
        run: npm run build

  # -----------------------------------------------------------------------
  # Job 3: Validate CloudFormation templates for changed infra
  # -----------------------------------------------------------------------
  validate-infra:
    name: Validate Infrastructure Templates
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.infra-shared == 'true' ||
      needs.detect-changes.outputs.infra-landing-page == 'true' ||
      needs.detect-changes.outputs.weather-collector == 'true' ||
      needs.detect-changes.outputs.finance-tracker == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validate shared infra templates
        if: needs.detect-changes.outputs.infra-shared == 'true'
        run: |
          echo "Validating shared infrastructure templates..."
          find infra/shared -name '*.yaml' -o -name '*.yml' -o -name '*.json' | while read -r template; do
            echo "  Validating: $template"
            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --no-cli-pager
          done

      - name: Validate landing-page infra templates
        if: needs.detect-changes.outputs.infra-landing-page == 'true'
        run: |
          echo "Validating landing-page infrastructure templates..."
          find infra/apps/landing-page -name '*.yaml' -o -name '*.yml' -o -name '*.json' | while read -r template; do
            echo "  Validating: $template"
            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --no-cli-pager
          done

      - name: Validate weather-collector template
        if: needs.detect-changes.outputs.weather-collector == 'true'
        run: |
          echo "Validating weather-collector template..."
          aws cloudformation validate-template \
            --template-body file://apps/weather/pipeline/infrastructure/template.yaml \
            --no-cli-pager

      - name: Validate finance-tracker template
        if: needs.detect-changes.outputs.finance-tracker == 'true'
        run: |
          echo "Validating finance-tracker template..."
          aws cloudformation validate-template \
            --template-body file://apps/finance/api/infrastructure/template.yaml \
            --no-cli-pager


  test-purgatory-rollup:
    name: Test — purgatory rollup
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.purgatory-rollup == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest boto3

      - name: Run rollup tests
        working-directory: apps/purgatory/rollup
        run: python -m pytest tests/ -q

      - name: Run API authorization tests
        working-directory: apps/purgatory/api
        run: python -m pytest tests/ -q

  # -----------------------------------------------------------------------
  # Job 8: Test the seller-statement parser
  #
  # The parser turns inbound statement emails into the ledger. It had no tests
  # at all until its synthetic-fixture suite was written; the prototype's tests
  # loaded a real mailbox and could not be kept.
  # -----------------------------------------------------------------------
  test-statement-parser:
    name: Test — statement parser
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python-tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Run parser tests
        working-directory: apps/investment-tracker/parser
        run: python -m pytest tests/ -q
