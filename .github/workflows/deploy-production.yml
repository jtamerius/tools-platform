            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment ended with status: $STATUS"; exit 1 ;;
              RUNNING|PENDING|PROVISIONING) ATTEMPT=$((ATTEMPT + 1)); sleep 30 ;;
              *) echo "Unexpected status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out."; exit 1

  # -----------------------------------------------------------------------
  # Job 7: Deploy globe-app frontend
  # -----------------------------------------------------------------------
  deploy-globe-app-frontend-production:
    name: Deploy globe-app Frontend — Production
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-amplify-globe-production
    if: |
      always() &&
