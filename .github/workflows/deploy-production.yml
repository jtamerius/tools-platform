name: Deploy — Production

on:
  push:
    branches:
      - main

# Ensure only one production deployment runs at a time.
# Never cancel an in-progress production deploy; queue the next one instead.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  id-token: write      # Required for OIDC token exchange
  contents: read       # Required for checkout
  pull-requests: read  # Required for dorny/paths-filter on private repos

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Detect which parts of the monorepo changed
  # -----------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      landing-page: ${{ steps.filter.outputs.landing-page }}
      weather-app: ${{ steps.filter.outputs.weather-app }}
      finance-app: ${{ steps.filter.outputs.finance-app }}
      globe-app: ${{ steps.filter.outputs.globe-app }}
      infra-cognito: ${{ steps.filter.outputs.infra-cognito }}
      infra-dns: ${{ steps.filter.outputs.infra-dns }}
      infra-amplify-landing: ${{ steps.filter.outputs.infra-amplify-landing }}
      infra-amplify-weather: ${{ steps.filter.outputs.infra-amplify-weather }}
      infra-amplify-finance: ${{ steps.filter.outputs.infra-amplify-finance }}
      infra-amplify-globe: ${{ steps.filter.outputs.infra-amplify-globe }}
      infra-monitoring: ${{ steps.filter.outputs.infra-monitoring }}
      infra-landing-page-app: ${{ steps.filter.outputs.infra-landing-page-app }}
      news-scraper: ${{ steps.filter.outputs.news-scraper }}
      weather-collector: ${{ steps.filter.outputs.weather-collector }}
      finance-tracker: ${{ steps.filter.outputs.finance-tracker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing-page:
              - 'apps/landing-page/**'
              - 'shared/**'
            weather-app:
              - 'apps/weather-app/**'
              - 'shared/**'
            finance-app:
              - 'apps/finance-app/**'
              - 'shared/**'
            globe-app:
              - 'apps/globe-app/**'
            infra-cognito:
              - 'infra/cdk/lib/stacks/cognito-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-dns:
              - 'infra/cdk/lib/stacks/dns-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-landing:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-weather:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-finance:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-globe:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-monitoring:
              - 'infra/cdk/lib/stacks/monitoring-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-landing-page-app:
              - 'infra/cdk/lib/stacks/landing-page-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            news-scraper:
              - 'apps/news-scraper/**'
              - 'infra/cdk/lib/stacks/news-scraper-stack.ts'
              - 'infra/cdk/lib/config.ts'
            weather-collector:
              - 'apps/weather_app/ensemble-plumes/**'
            finance-tracker:
              - 'apps/weather_app/finance-tracker/**'

  # -----------------------------------------------------------------------
  # Job 2a: Deploy Cognito stack
  # -----------------------------------------------------------------------
  deploy-cognito-production:
    name: Deploy Cognito — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-cognito == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-cognito-production -c env=production --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 2b: Deploy DNS / ACM stack
  # -----------------------------------------------------------------------
  deploy-dns-production:
    name: Deploy DNS — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-dns == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-dns-production -c env=production --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 2c–f: Deploy Amplify stacks (one per app)
  # -----------------------------------------------------------------------
  deploy-amplify-landing-production:
    name: Deploy Amplify (landing-page) — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-landing == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-production -c env=production --require-approval never --no-cli-pager

  deploy-amplify-weather-production:
    name: Deploy Amplify (weather-app) — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-weather == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-weather-production -c env=production --require-approval never --no-cli-pager

  deploy-amplify-finance-production:
    name: Deploy Amplify (finance-app) — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-finance == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-finance-production -c env=production --require-approval never --no-cli-pager

  deploy-amplify-globe-production:
    name: Deploy Amplify (globe-app) — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-globe == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-globe-production -c env=production --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 2g: Deploy Monitoring stack
  # -----------------------------------------------------------------------
  deploy-monitoring-production:
    name: Deploy Monitoring — Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-monitoring == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-monitoring-production -c env=production --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 3: Deploy landing-page app infrastructure (SSM params)
  # -----------------------------------------------------------------------
  deploy-landing-page-app-production:
    name: Deploy landing-page App Infra — Production
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-cognito-production
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.infra-landing-page-app == 'true' &&
      (needs.deploy-cognito-production.result == 'success' ||
       needs.deploy-cognito-production.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-app-landing-page-production -c env=production --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 4: Deploy landing-page frontend via Amplify (main branch)
  # -----------------------------------------------------------------------
  deploy-landing-page-frontend-production:
    name: Deploy landing-page Frontend — Production
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-landing-page-app-production
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.landing-page == 'true' &&
      (needs.deploy-landing-page-app-production.result == 'success' ||
       needs.deploy-landing-page-app-production.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/production/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/production/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=production" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/landing-page
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/landing-page/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_LANDING_PAGE }} \
            --branch-name main --output json --no-cli-pager)

          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_LANDING_PAGE }} \
            --branch-name main --job-id "$JOB_ID" --no-cli-pager

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="${{ secrets.AMPLIFY_APP_ID_LANDING_PAGE }}"
          BRANCH="main"
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text --no-cli-pager)
            echo "  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS — Status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment ended with status: $STATUS"; exit 1 ;;
              RUNNING|PENDING|PROVISIONING) ATTEMPT=$((ATTEMPT + 1)); sleep 30 ;;
              *) echo "Unexpected status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out."; exit 1

  # -----------------------------------------------------------------------
  # Job 5: Deploy weather-app frontend
  # -----------------------------------------------------------------------
  deploy-weather-app-frontend-production:
    name: Deploy weather-app Frontend — Production
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-amplify-weather-production
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.weather-app == 'true' &&
      (needs.deploy-amplify-weather-production.result == 'success' ||
       needs.deploy-amplify-weather-production.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install and build
        working-directory: apps/weather-app
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/weather-app/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_WEATHER_APP }} \
            --branch-name main --output json --no-cli-pager)

          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_WEATHER_APP }} \
            --branch-name main --job-id "$JOB_ID" --no-cli-pager

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="${{ secrets.AMPLIFY_APP_ID_WEATHER_APP }}"
          BRANCH="main"
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text --no-cli-pager)
            echo "  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS — Status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment ended with status: $STATUS"; exit 1 ;;
              RUNNING|PENDING|PROVISIONING) ATTEMPT=$((ATTEMPT + 1)); sleep 30 ;;
              *) echo "Unexpected status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out."; exit 1

  # -----------------------------------------------------------------------
  # Job 6: Deploy finance-app frontend
  # -----------------------------------------------------------------------
  deploy-finance-app-frontend-production:
    name: Deploy finance-app Frontend — Production
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-amplify-finance-production
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.finance-app == 'true' &&
      (needs.deploy-amplify-finance-production.result == 'success' ||
       needs.deploy-amplify-finance-production.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/production/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/production/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=production" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/finance-app
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/finance-app/dist
