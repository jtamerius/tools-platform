  # -----------------------------------------------------------------------
  # Job: Run SolarHail pipeline tests (fast + slow integration)
  # -----------------------------------------------------------------------
  test-solarhail-pipeline-staging:
    name: Test SolarHail Pipeline — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.solarhail-pipeline == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libeccodes-dev libgeos-dev libproj-dev gcc g++
      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r apps/solarhail/pipeline/requirements.txt
          pip install pytest
      - name: Run tests
        working-directory: apps/solarhail/pipeline
        run: pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Job: Build and push SolarHail pipeline Docker image to ECR
  # -----------------------------------------------------------------------
  build-push-solarhail-pipeline-staging:
    name: Build & Push SolarHail Pipeline — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-solarhail-staging
      - test-solarhail-pipeline-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.solarhail-pipeline == 'true' &&
      needs.test-solarhail-pipeline-staging.result == 'success' &&
      (needs.deploy-solarhail-staging.result == 'success' ||
       needs.deploy-solarhail-staging.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          ECR_URI="606196119553.dkr.ecr.us-east-1.amazonaws.com/tools-solarhail-pipeline-staging"
          SHA="${{ github.sha }}"
          docker build -t "$ECR_URI:$SHA" -t "$ECR_URI:latest" apps/solarhail/pipeline/
