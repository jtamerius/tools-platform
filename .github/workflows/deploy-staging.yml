          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_FINANCE_APP }} \
            --branch-name staging --job-id "$JOB_ID" --no-cli-pager

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="${{ secrets.AMPLIFY_APP_ID_FINANCE_APP }}"
          BRANCH="staging"
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text --no-cli-pager)
            echo "  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS — Status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment ended with status: $STATUS"; exit 1 ;;
              RUNNING|PENDING|PROVISIONING) ATTEMPT=$((ATTEMPT + 1)); sleep 30 ;;
              *) echo "Unexpected status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out."; exit 1

  # -----------------------------------------------------------------------
  # Job 7: Deploy globe-app frontend
  # -----------------------------------------------------------------------
  deploy-globe-app-frontend-staging:
    name: Deploy globe-app Frontend — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-amplify-globe-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.globe-app == 'true' &&
      (needs.deploy-amplify-globe-staging.result == 'success' ||
       needs.deploy-amplify-globe-staging.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/globe-app/package.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install and build
        working-directory: apps/globe-app
        run: |
          npm ci
