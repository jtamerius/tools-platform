  # -----------------------------------------------------------------------
  # Job 8: Deploy news-scraper Lambda + EventBridge (via CDK)
  # -----------------------------------------------------------------------
  deploy-news-scraper-staging:
    name: Deploy news-scraper — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.news-scraper == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Package Lambda
        run: bash apps/news-scraper/package_lambda.sh

      - name: Upload zip to S3
        run: |
          aws s3 cp apps/news-scraper/lambda_package.zip \
            s3://jtamerius-website-deploy/news-scraper/lambda_package.zip \
            --no-cli-pager

      - name: Deploy CDK stack
        run: |
          cd infra/cdk && npm ci
          npx cdk deploy tools-app-news-scraper-staging -c env=staging --require-approval never --no-cli-pager

      - name: Force Lambda code refresh
        run: |
          aws lambda update-function-code \
            --function-name jtamerius-news-scraper-staging \
            --s3-bucket jtamerius-website-deploy \
            --s3-key news-scraper/lambda_package.zip \
            --no-cli-pager \
            --query '[LastModified,CodeSize]' --output text
