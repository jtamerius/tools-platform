name: Deploy — Staging

on:
  push:
    branches:
      - staging

permissions:
  id-token: write      # Required for OIDC token exchange
  contents: read       # Required for checkout
  pull-requests: read  # Required for dorny/paths-filter on private repos

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Detect which parts of the monorepo changed
  # -----------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      landing-page: ${{ steps.filter.outputs.landing-page }}
      weather-app: ${{ steps.filter.outputs.weather-app }}
      finance-app: ${{ steps.filter.outputs.finance-app }}
      globe-app: ${{ steps.filter.outputs.globe-app }}
      infra-cognito: ${{ steps.filter.outputs.infra-cognito }}
      infra-dns: ${{ steps.filter.outputs.infra-dns }}
      infra-amplify-landing: ${{ steps.filter.outputs.infra-amplify-landing }}
      infra-amplify-weather: ${{ steps.filter.outputs.infra-amplify-weather }}
      infra-amplify-finance: ${{ steps.filter.outputs.infra-amplify-finance }}
      infra-amplify-globe: ${{ steps.filter.outputs.infra-amplify-globe }}
      infra-monitoring: ${{ steps.filter.outputs.infra-monitoring }}
      infra-landing-page-app: ${{ steps.filter.outputs.infra-landing-page-app }}
      news-scraper: ${{ steps.filter.outputs.news-scraper }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing-page:
              - 'apps/landing-page/**'
              - 'shared/**'
            weather-app:
              - 'apps/weather-app/**'
              - 'shared/**'
            finance-app:
              - 'apps/finance-app/**'
              - 'shared/**'
            globe-app:
              - 'apps/globe-app/**'
            infra-cognito:
              - 'infra/cdk/lib/stacks/cognito-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-dns:
              - 'infra/cdk/lib/stacks/dns-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-landing:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-weather:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-finance:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-amplify-globe:
              - 'infra/cdk/lib/stacks/amplify-stack.ts'
              - 'infra/cdk/lib/constructs/amplify-hosting.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-monitoring:
              - 'infra/cdk/lib/stacks/monitoring-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            infra-landing-page-app:
              - 'infra/cdk/lib/stacks/landing-page-stack.ts'
              - 'infra/cdk/lib/config.ts'
              - 'infra/cdk/bin/app.ts'
            news-scraper:
              - 'apps/news-scraper/**'
              - 'infra/cdk/lib/stacks/news-scraper-stack.ts'
              - 'infra/cdk/lib/config.ts'

  # -----------------------------------------------------------------------
  # CDK helper — reusable setup steps (referenced via needs/run)
  # Each infra job sets up Node + CDK identically.
  # -----------------------------------------------------------------------

  # -----------------------------------------------------------------------
  # Job 2a: Deploy Cognito stack
  # -----------------------------------------------------------------------
  deploy-cognito-staging:
    name: Deploy Cognito — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-cognito == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-cognito-staging -c env=staging --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 2b: Deploy DNS / ACM stack
  # -----------------------------------------------------------------------
  deploy-dns-staging:
    name: Deploy DNS — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-dns == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-dns-staging -c env=staging --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 2c–f: Deploy Amplify stacks (one per app)
  # -----------------------------------------------------------------------
  deploy-amplify-landing-staging:
    name: Deploy Amplify (landing-page) — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-landing == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-staging -c env=staging --require-approval never --no-cli-pager

  deploy-amplify-weather-staging:
    name: Deploy Amplify (weather-app) — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-weather == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-weather-staging -c env=staging --require-approval never --no-cli-pager

  deploy-amplify-finance-staging:
    name: Deploy Amplify (finance-app) — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-finance == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-finance-staging -c env=staging --require-approval never --no-cli-pager

  deploy-amplify-globe-staging:
    name: Deploy Amplify (globe-app) — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-amplify-globe == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-amplify-globe-staging -c env=staging --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 2g: Deploy Monitoring stack
  # -----------------------------------------------------------------------
  deploy-monitoring-staging:
    name: Deploy Monitoring — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-monitoring == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-shared-monitoring-staging -c env=staging --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 3: Deploy landing-page app infrastructure (SSM params)
  # -----------------------------------------------------------------------
  deploy-landing-page-app-staging:
    name: Deploy landing-page App Infra — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-cognito-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.infra-landing-page-app == 'true' &&
      (needs.deploy-cognito-staging.result == 'success' ||
       needs.deploy-cognito-staging.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json
      - run: cd infra/cdk && npm ci
      - run: cd infra/cdk && npx cdk deploy tools-app-landing-page-staging -c env=staging --require-approval never --no-cli-pager

  # -----------------------------------------------------------------------
  # Job 4: Deploy landing-page frontend via Amplify (staging branch)
  # -----------------------------------------------------------------------
  deploy-landing-page-frontend-staging:
    name: Deploy landing-page Frontend — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-landing-page-app-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.landing-page == 'true' &&
      (needs.deploy-landing-page-app-staging.result == 'success' ||
       needs.deploy-landing-page-app-staging.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=staging" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/landing-page
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/landing-page/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_LANDING_PAGE }} \
            --branch-name staging \
            --output json \
            --no-cli-pager)

          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_LANDING_PAGE }} \
            --branch-name staging \
            --job-id "$JOB_ID" \
            --no-cli-pager

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="${{ secrets.AMPLIFY_APP_ID_LANDING_PAGE }}"
          BRANCH="staging"
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text --no-cli-pager)
            echo "  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS — Status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment ended with status: $STATUS"; exit 1 ;;
              RUNNING|PENDING|PROVISIONING) ATTEMPT=$((ATTEMPT + 1)); sleep 30 ;;
              *) echo "Unexpected status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out."; exit 1

  # -----------------------------------------------------------------------
  # Job 5: Deploy weather-app frontend
  # -----------------------------------------------------------------------
  deploy-weather-app-frontend-staging:
    name: Deploy weather-app Frontend — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-amplify-weather-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.weather-app == 'true' &&
      (needs.deploy-amplify-weather-staging.result == 'success' ||
       needs.deploy-amplify-weather-staging.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=staging" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/weather-app
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/weather-app/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_WEATHER_APP }} \
            --branch-name staging --output json --no-cli-pager)

          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_WEATHER_APP }} \
            --branch-name staging --job-id "$JOB_ID" --no-cli-pager

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="${{ secrets.AMPLIFY_APP_ID_WEATHER_APP }}"
          BRANCH="staging"
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text --no-cli-pager)
            echo "  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS — Status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Deployment succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Deployment ended with status: $STATUS"; exit 1 ;;
              RUNNING|PENDING|PROVISIONING) ATTEMPT=$((ATTEMPT + 1)); sleep 30 ;;
              *) echo "Unexpected status: $STATUS"; exit 1 ;;
            esac
          done
          echo "Timed out."; exit 1

  # -----------------------------------------------------------------------
  # Job 6: Deploy finance-app frontend
  # -----------------------------------------------------------------------
  deploy-finance-app-frontend-staging:
    name: Deploy finance-app Frontend — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-amplify-finance-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.finance-app == 'true' &&
      (needs.deploy-amplify-finance-staging.result == 'success' ||
       needs.deploy-amplify-finance-staging.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=staging" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/finance-app
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/finance-app/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID_FINANCE_APP }} \
