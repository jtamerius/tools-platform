name: Deploy — Staging

on:
  push:
    branches:
      - staging

permissions:
  id-token: write      # Required for OIDC token exchange
  contents: read       # Required for checkout
  pull-requests: read  # Required for dorny/paths-filter on private repos

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Detect which parts of the monorepo changed
  # -----------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      landing-page: ${{ steps.filter.outputs.landing-page }}
      weather-app: ${{ steps.filter.outputs.weather-app }}
      finance-app: ${{ steps.filter.outputs.finance-app }}
      infra-shared: ${{ steps.filter.outputs.infra-shared }}
      infra-landing-page: ${{ steps.filter.outputs.infra-landing-page }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing-page:
              - 'apps/landing-page/**'
              - 'shared/**'
            weather-app:
              - 'apps/weather-app/**'
              - 'shared/**'
            finance-app:
              - 'apps/finance-app/**'
              - 'shared/**'
            infra-shared:
              - 'infra/shared/**'
            infra-landing-page:
              - 'infra/apps/landing-page/**'

  # -----------------------------------------------------------------------
  # Job 2: Deploy shared infrastructure to staging
  # -----------------------------------------------------------------------
  deploy-shared-infra-staging:
    name: Deploy Shared Infra — Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra-shared == 'true'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy shared stacks
        run: bash infra/scripts/deploy-shared.sh staging

      - name: Wait for shared stacks to stabilize
        run: |
          echo "Waiting for all shared stacks to reach a stable state..."
          # Collect stack names deployed by the script; adjust the prefix to match your naming convention.
          STACKS=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_IN_PROGRESS UPDATE_IN_PROGRESS UPDATE_COMPLETE_CLEANUP_IN_PROGRESS \
            --query "StackSummaries[?starts_with(StackName, 'tools-shared-') && ends_with(StackName, '-staging')].StackName" \
            --output text \
            --no-cli-pager)

          for STACK in $STACKS; do
            echo "  Waiting on stack: $STACK"
            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK" \
              --no-cli-pager || \
            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK" \
              --no-cli-pager
          done

          echo "All shared stacks are stable."

  # -----------------------------------------------------------------------
  # Job 3: Deploy landing-page infrastructure to staging
  # -----------------------------------------------------------------------
  deploy-landing-page-infra-staging:
    name: Deploy landing-page Infra — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-shared-infra-staging
    # Run when infra changed OR when the shared-infra job was skipped (no infra changes)
    # but we still need to gate on infra-landing-page having changed.
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.infra-landing-page == 'true' &&
      (needs.deploy-shared-infra-staging.result == 'success' ||
       needs.deploy-shared-infra-staging.result == 'skipped')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy landing-page app infrastructure
        run: bash infra/scripts/deploy-app.sh landing-page staging

  # -----------------------------------------------------------------------
  # Job 4: Deploy landing-page frontend via Amplify (staging branch)
  # -----------------------------------------------------------------------
  deploy-landing-page-frontend-staging:
    name: Deploy landing-page Frontend — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-landing-page-infra-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.landing-page == 'true' &&
      (needs.deploy-landing-page-infra-staging.result == 'success' ||
       needs.deploy-landing-page-infra-staging.result == 'skipped')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=staging" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/landing-page
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/landing-page/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id d223wq48sddq6t \
            --branch-name staging \
            --output json \
            --no-cli-pager)

          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          echo "Uploading dist.zip to Amplify presigned URL..."
          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id d223wq48sddq6t \
            --branch-name staging \
            --job-id "$JOB_ID" \
            --no-cli-pager

          echo "Amplify deployment started: $JOB_ID"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="d223wq48sddq6t"
          BRANCH="staging"
          MAX_ATTEMPTS=60   # 60 × 30s = 30 minutes max
          ATTEMPT=0

          echo "Polling Amplify job $JOB_ID on branch $BRANCH..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text \
              --no-cli-pager)

            echo "  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS — Status: $STATUS"

            case "$STATUS" in
              SUCCEED)
                echo "Amplify deployment succeeded."
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Amplify deployment ended with status: $STATUS"
                exit 1
                ;;
              RUNNING|PENDING|PROVISIONING)
                ATTEMPT=$((ATTEMPT + 1))
                sleep 30
                ;;
              *)
                echo "Unexpected status: $STATUS — treating as failure."
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Amplify deployment."
          exit 1

  # -----------------------------------------------------------------------
  # Job 5: Build and deploy weather-app to Amplify (staging branch)
  # GHA builds the artifacts; Amplify receives them via manual deployment.
  # -----------------------------------------------------------------------
  deploy-weather-app-frontend-staging:
    name: Deploy weather-app Frontend — Staging
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-shared-infra-staging
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.weather-app == 'true' &&
      (needs.deploy-shared-infra-staging.result == 'success' ||
       needs.deploy-shared-infra-staging.result == 'skipped')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch build env vars from SSM
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/user-pool-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter \
            --name /tools/staging/cognito/client-id \
            --query Parameter.Value --output text --no-cli-pager)" >> "$GITHUB_ENV"
          echo "VITE_ENV=staging" >> "$GITHUB_ENV"

      - name: Install and build
        working-directory: apps/weather-app
        run: |
          npm ci
          npm run build

      - name: Package and deploy to Amplify
        id: deploy
        run: |
          cd apps/weather-app/dist
          zip -r ../dist.zip .
          cd ..

          RESULT=$(aws amplify create-deployment \
            --app-id d26oqifvpt9ysq \
            --branch-name staging \
            --output json \
            --no-cli-pager)

          JOB_ID=$(echo "$RESULT" | jq -r '.jobId')
          ZIP_URL=$(echo "$RESULT" | jq -r '.zipUploadUrl')

          echo "Uploading dist.zip to Amplify presigned URL..."
          curl --fail -T dist.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id d26oqifvpt9ysq \
            --branch-name staging \
            --job-id "$JOB_ID" \
            --no-cli-pager

          echo "Amplify deployment started: $JOB_ID"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to complete
        run: |
          JOB_ID="${{ steps.deploy.outputs.job_id }}"
          APP_ID="d26oqifvpt9ysq"
          BRANCH="staging"
